[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonycam"
version = "0.1.0"
description = "Sony alpha 7C II aperture sequence capture"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.4,<13"]

[project.scripts]
sonycam = "sonycam.cli:main"

[tool.setuptools.packages.find]
include = ["sonycam*"]

